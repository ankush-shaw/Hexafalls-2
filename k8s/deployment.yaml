apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisos-backend
  namespace: default
  labels:
    app: aegisos-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisos-backend
  template:
    metadata:
      labels:
        app: aegisos-backend
    spec:
      containers:
        - name: backend
          image: aegisos/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
